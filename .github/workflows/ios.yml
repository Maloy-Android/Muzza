name: iOS Build

on:
  push:
    branches: [ main, master, kmp ]
  workflow_dispatch:

jobs:
  build-signed-ipa:
    runs-on: macos-15
    env:
      IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test Swift syntax and media handling
        run: |
          for source in iosApp/iosApp/*.swift; do xcrun swiftc -frontend -parse "$source"; done
          plutil -lint iosApp/iosApp/ru.lproj/Localizable.strings
          xcrun swiftc -swift-version 5 iosApp/iosApp/MuzzaResourceLoader.swift iosApp/iosApp/MuzzaLyricsParser.swift iosApp/iosApp/MuzzaCookieFilter.swift iosApp/iosApp/MuzzaDownloadStore.swift iosApp/iosApp/MuzzaQueueRules.swift iosApp/Tests/main.swift -o "$RUNNER_TEMP/ios-media-tests"
          "$RUNNER_TEMP/ios-media-tests"

      - name: Test iOS transport and library
        run: ./gradlew :innertube:iosSimulatorArm64Test :shared:iosSimulatorArm64Test --no-daemon --console=plain

      - name: Upload iOS test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            innertube/build/test-results/iosSimulatorArm64Test/
            shared/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: ignore

      - name: Build and launch the iOS simulator app
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime,items in data["devices"].items() if ".iOS-" in runtime for d in items if d["isAvailable"] and d["name"].startswith("iPhone")]; assert devices, "No available iPhone simulator"; print(next((d["udid"] for d in devices if d["state"] == "Booted"), devices[0]["udid"]))')"
          if ! xcrun simctl list devices booted | grep -F "$SIMULATOR_ID" >/dev/null; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild \
            -quiet \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/ios-simulator-build/Build/Products/Debug-iphonesimulator/iosApp.app"
          LAUNCH_OUTPUT="$(xcrun simctl launch "$SIMULATOR_ID" com.maloy.muzza)"
          echo "$LAUNCH_OUTPUT"
          APP_PID="${LAUNCH_OUTPUT##*: }"
          sleep 20
          kill -0 "$APP_PID"
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/ios-simulator-home.png"

      - name: Upload iOS simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-home
          path: ${{ runner.temp }}/ios-simulator-home.png
          retention-days: 7

      - name: Skip unsigned signing setup
        id: signing
        run: |
          if [ -z "$IOS_SIGNING_CERTIFICATE_BASE64" ] || [ -z "$IOS_SIGNING_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signed IPA secrets are not configured."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install signing certificate and provisioning profile
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/muzza-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/muzza-signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/muzza-certificate.pem"
          PRIVATE_KEY_PEM="$RUNNER_TEMP/muzza-private-key.pem"
          PROFILE_PATH="$RUNNER_TEMP/muzza.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/muzza-profile.plist"

          printf '%s' "$IOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -passin "pass:$IOS_SIGNING_CERTIFICATE_PASSWORD" -clcerts -nokeys -out "$CERTIFICATE_PEM"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -passin "pass:$IOS_SIGNING_CERTIFICATE_PASSWORD" -nocerts -nodes -out "$PRIVATE_KEY_PEM"
          security import "$CERTIFICATE_PEM" -A -t cert -k "$KEYCHAIN_PATH"
          security import "$PRIVATE_KEY_PEM" -A -t priv -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesigning: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)"
          test -n "$SIGNING_IDENTITY"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build and export signed IPA
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail

          rm -rf iosApp/build/Release-iphoneos iosApp/build/Build.xcarchive iosApp/build/IPA
          mkdir -p iosApp/build/IPA

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath iosApp/build \
            -archivePath iosApp/build/Build.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=app.orange2516.nance975 \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.orange2516.nance975</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath iosApp/build/Build.xcarchive \
            -exportPath iosApp/build/IPA \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: muzza-signed-ipa
          path: iosApp/build/IPA/*.ipa
          retention-days: 7
